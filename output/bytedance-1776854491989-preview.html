    .metric-value{
      font-size:34px;
      font-weight:800;
      letter-spacing:-0.04em;
      color:#fff;
      margin-bottom:6px;
    }
    .metric-label{
      font-size:14px;
      color:var(--muted);
      line-height:1.5;
    }

    .products-wrap{
      display:grid;
      gap:28px;
    }
    .product-tabs{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      margin-bottom:22px;
    }
    .product-tab{
      padding:14px 18px;
      border-radius:14px;
      border:1px solid var(--line-strong);
      background:#111111;
      color:#ddd;
      font-weight:700;
      cursor:pointer;
      transition:all .25s ease;
    }
    .product-tab.active{
      background:rgba(255,107,0,0.12);
      border-color:rgba(255,107,0,0.45);
      color:#fff;
      box-shadow:var(--hard-shadow);
    }

    .product-panel{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:30px;
      align-items:start;
    }
    .spotlight-panel,
    .feature-panel,
    .video-visual,
    .pricing-card,
    .testimonial-card,
    .why-card,
    .gallery-card{
      background:linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      border:1px solid var(--line);
      border-radius:22px;
      box-shadow:var(--shadow);
    }
    .spotlight-panel{
      padding:20px;
      position:relative;
      overflow:hidden;
    }
    .spotlight-panel::after{
      content:'';
      position:absolute;
      inset:auto -20% -30% auto;
      width:240px;
      height:240px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(255,107,0,0.22), transparent 70%);
      pointer-events:none;
    }
    .spotlight-image{
      border-radius:16px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,0.08);
      margin-bottom:18px;
    }
    .spotlight-image img{
      width:100%;
      height:340px;
      object-fit:cover;
    }
    .spotlight-text h3{
      font-size:34px;
      margin:0 0 12px;
      line-height:1.1;
      font-weight:800;
      letter-spacing:-0.03em;
    }
    .spotlight-text p{
      color:var(--muted);
      font-size:16px;
      line-height:1.8;
      margin:0 0 20px;
    }
    .feature-panel{
      padding:18px;
    }
    .feature-grid{
      display:grid;
      grid-template-columns:1fr;
      gap:14px;
    }
    .feature-card{
      display:grid;
      grid-template-columns:64px 1fr 96px;
      gap:16px;
      align-items:center;
      padding:14px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,0.06);
      background:rgba(255,255,255,0.02);
      transition:transform .3s ease, border-color .3s ease, background .3s ease;
    }
    .feature-card:hover{
      transform:translateY(-4px);
      border-color:rgba(255,107,0,0.3);
      background:rgba(255,107,0,0.04);
    }
    .feature-icon{
      width:52px;
      height:52px;
      border-radius:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(255,107,0,0.08);
      border:1px solid rgba(255,107,0,0.24);
    }
    .feature-icon svg{width:28px;height:28px}
    .feature-copy h4{
      margin:0 0 6px;
      font-size:18px;
      line-height:1.35;
      font-weight:800;
    }
    .feature-copy p{
      margin:0;
      color:var(--muted);
      font-size:14px;
      line-height:1.6;
    }
    .feature-thumb{
      width:100%;
      height:74px;
      object-fit:cover;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.08);
    }

    .accordion-layout{
      display:grid;
      grid-template-columns:0.95fr 1.05fr;
      gap:30px;
      align-items:start;
    }
    .accordion-list{
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .accordion-item{
      border:1px solid var(--line);
      border-radius:18px;
      overflow:hidden;
      background:rgba(255,255,255,0.02);
      transition:border-color .25s ease, background .25s ease;
    }
    .accordion-item.active{
      border-color:rgba(255,107,0,0.34);
      background:rgba(255,107,0,0.05);
    }
    .accordion-head{
      width:100%;
      background:none;
      border:none;
      color:#fff;
      text-align:left;
      padding:18px 20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      cursor:pointer;
      font-weight:800;
      font-size:17px;
    }
    .accordion-head span:last-child{
      color:var(--accent);
      font-size:24px;
      line-height:1;
    }
    .accordion-body{
      max-height:0;
      overflow:hidden;
      transition:max-height .35s ease;
    }
    .accordion-item.active .accordion-body{
      max-height:220px;
    }
    .accordion-inner{
      padding:0 20px 18px;
      color:var(--muted);
      line-height:1.8;
      font-size:15px;
    }
    .video-visual{
      padding:20px;
      position:relative;
      overflow:hidden;
      min-height:100%;
    }
    .video-preview{
      border-radius:18px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,0.08);
      margin-bottom:16px;
    }
    .video-preview img{
      width:100%;
      height:360px;
      object-fit:cover;
    }
    .video-meta{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:12px;
    }
    .video-meta .meta-box{
      padding:14px;
      border-radius:16px;
      background:#111111;
      border:1px solid var(--line);
    }
    .meta-box strong{
      display:block;
      font-size:18px;
      margin-bottom:4px;
    }
    .meta-box span{
      color:var(--muted);
      font-size:13px;
      line-height:1.5;
    }

    .why-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:18px;
    }
    .why-card{
      padding:24px;
      box-shadow:var(--hard-shadow), var(--shadow);
    }
    .why-icon{
      width:56px;
      height:56px;
      border-radius:16px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(255,107,0,0.08);
      border:1px solid rgba(255,107,0,0.24);
      margin-bottom:18px;
    }
    .why-card h3{
      margin:0 0 10px;
      font-size:20px;
      font-weight:800;
    }
    .why-card p{
      margin:0;
      color:var(--muted);
      font-size:15px;
      line-height:1.75;
    }

    .gallery-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:16px;
    }
    .gallery-card{
      overflow:hidden;
      position:relative;
    }
    .gallery-card img{
      width:100%;
      height:220px;
      object-fit:cover;
      transition:transform .45s ease, filter .45s ease;
    }
    .gallery-card:hover img{
      transform:scale(1.06);
      filter:saturate(1.1);
    }
    .gallery-overlay{
      position:absolute;
      inset:auto 14px 14px 14px;
      padding:12px 14px;
      border-radius:14px;
      background:rgba(10,10,10,0.72);
      backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,0.08);
      font-size:13px;
      font-weight:700;
      color:#fff;
    }

    .pricing-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:24px;
      align-items:stretch;
    }
    .pricing-card{
      padding:28px;
      position:relative;
      display:flex;
      flex-direction:column;
      box-shadow:var(--shadow);
    }
    .pricing-card.highlight{
      border-color:rgba(255,107,0,0.4);
      box-shadow:var(--hard-shadow), var(--shadow);
      transform:translateY(-4px);
    }
    .pricing-badge{
      position:absolute;
      top:18px;
      right:18px;
      background:rgba(32,200,99,0.14);
      color:#7ff0ad;
      border:1px solid rgba(32,200,99,0.3);
      padding:8px 12px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
    }
    .pricing-name{

      font-weight:800;
      line-height:1.3;
      margin:0 0 18px;
      max-width:88%;
    }
    .price-row{
      display:flex;
      align-items:flex-end;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }
    .old-price{
      color:#8b8b8b;
      text-decoration:line-through;
      font-size:18px;
      font-weight:600;
    }
    .new-price{

      font-size:34px;
      font-weight:800;
      letter-spacing:-0.04em;
    }
    .pricing-sub{
      color:#9be7b8;
      font-size:14px;
      font-weight:700;
      margin-bottom:20px;
    }
    .checklist{

      display:grid;
      gap:12px;
    }

      font-size:15px;
    }

      justify-content:center;

      color:#6ee59f;
      font-size:12px;
      margin-top:2px;
    }

    }
    .testimonial-carousel{
      overflow:hidden;
      position:relative;
    }
    .testimonial-track{

      font-size:18px;
      letter-spacing:2px;
      margin-bottom:14px;
    }
    .testimonial-text{
      font-size:20px;
      line-height:1.8;
      color:#e8e8e8;
      margin:0 0 22px;
    }
    .testimonial-author{
      font-weight:800;
      font-size:18px;
      margin-bottom:4px;

    .testimonial-role{

    }

      display:flex;

      margin-top:22px;
      gap:16px;
    }
    .arrow-group{
      display:flex;
      gap:12px;
    }
    .arrow-btn{
      width:50px;
      height:50px;
      border-radius:14px;

      color:#fff;
      cursor:pointer;
      font-size:20px;
      transition:all .25s ease;
    }

      transition:all .25s ease;

    .dot.active{
      width:28px;
      border-radius:999px;
      background:var(--accent);
    }

    .footer-techjockey{
      background:#0b0b0b;
      border-top:1px solid var(--line);
      padding:56px 0 28px;
    }
    .footer-grid{
      display:grid;
      grid-template-columns:1.2fr .8fr .8fr;
      gap:28px;
      margin-bottom:28px;
    }

      width:150px;
      margin-bottom:18px;
      filter:brightness(1.05);

      color:var(--muted);
      line-height:1.8;
      font-size:15px;
      margin:0;
    }
    .footer-title{
      font-size:16px;
      font-weight:800;
      margin:0 0 14px;
    }
    .footer-links{
      display:grid;
      gap:10px;
    }
    .footer-links a:hover{color:#fff}
    .footer-bottom{
      padding-top:18px;

      display:flex;
      justify-content:space-between;
      gap:16px;
      flex-wrap:wrap;
      color:var(--muted-2);
      font-size:14px;
    }

    .reveal{
      opacity:0;
      transform:translateY(28px);
      transition:opacity .7s ease, transform .7s ease;
    }
    .reveal.revealed{
      opacity:1;
      transform:translateY(0);
    }

    @keyframes blink{
      0%, 50%{opacity:1}

    @keyframes floatY{
      0%,100%{transform:translateY(0)}

        margin-top:12px;
      }
      .footer-bottom{
        flex-direction:column;
      }
      .hero-cta{flex-direction:column;align-items:stretch}
      .btn{width:100%}
      .nav-right .btn{width:auto}
    }
