    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    const loadScript = src => new Promise(resolve => {
      if (document.querySelector(`script[src="${src}"]`)) return resolve();
      const s = document.createElement('script');
      s.src = src;
      s.async = true;
      s.onload = resolve;
      s.onerror = resolve;
      document.body.appendChild(s);
    });
    const initCinematic = () => {
      if (!window.gsap || !window.ScrollTrigger) return;
      const gsap = window.gsap;
      const ScrollTrigger = window.ScrollTrigger;

          scrollTrigger: {
            trigger: el.closest('section') || el,

            end: 'bottom top',

          duration: 1.1,
          scrollTrigger: {
            trigger: el,
            start: 'top 80%',
            toggleActions: 'play none none reverse'
          }
        });
      });
      gsap.utils.toArray('.stagger-parent').forEach(parent => {
        gsap.to(parent.children, {
          opacity: 1,
          y: 0,
          duration: 0.8,
          stagger: 0.12,
          ease: 'power3.out',
          scrollTrigger: {
            trigger: parent,
            start: 'top 80%',
            toggleActions: 'play none none none'
          }
        });
      });
      gsap.utils.toArray('.split-text').forEach(el => {
        const text = el.getAttribute('data-text') || el.textContent;
        el.innerHTML = text.split('').map(char => char === ' ' ? ' ' : `<span class="char" style="display:inline-block;will-change:transform,opacity">${char}</span>`).join('');
        gsap.from(el.querySelectorAll('.char'), {
          y: 80,
          opacity: 0,
          rotateX: -40,
          stagger: 0.025,
          duration: 0.9,
          ease: 'power3.out',
          scrollTrigger: {
            trigger: el,
            start: 'top 85%',
            toggleActions: 'play none none none'
          }
        });
      });
      gsap.utils.toArray('.text-reveal-mask').forEach(mask => {
        const inner = mask.querySelector('.text-reveal-inner');
        if (!inner) return;
        gsap.to(inner, {
          y: '0%',
          duration: 1.0,
          ease: 'power4.out',
          scrollTrigger: {
            trigger: mask,
            start: 'top 85%',
            toggleActions: 'play none none reverse'
          }
        });
      });
      document.querySelectorAll('.btn-magnetic').forEach(btn => {
        btn.addEventListener('mousemove', e => {
          const rect = btn.getBoundingClientRect();
          const x = (e.clientX - rect.left - rect.width / 2) * 0.35;
          const y = (e.clientY - rect.top - rect.height / 2) * 0.35;
          gsap.to(btn, {
            x,
            y,
            duration: 0.4,
            ease: 'power2.out'
          });
        });
        btn.addEventListener('mouseleave', () => {
          gsap.to(btn, {
            x: 0,
            y: 0,
            duration: 0.6,
            ease: 'elastic.out(1, 0.4)'
          });
        });
      });
      gsap.utils.toArray('.pin-scene').forEach(scene => {
        ScrollTrigger.create({
          trigger: scene,
          start: 'top top',
          end: '+=600',
          pin: true,
          pinSpacing: true

      gsap.utils.toArray('[data-count]').forEach(el => {
        const target = parseFloat(el.dataset.count);
        const prefix = el.dataset.prefix || '';

        gsap.from({

          ease: 'power2.out',
          snap: {
            val: 1
          },
          scrollTrigger: {
            trigger: el,
            start: 'top 80%',
            once: true
          },
          onUpdate: function () {
            el.textContent = prefix + Math.round(this.targets()[0].val).toLocaleString() + suffix;
          }
        });
      });
      return () => {
        window.removeEventListener('mousemove', moveGlow);
      };
