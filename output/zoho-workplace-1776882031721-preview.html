      box-shadow:0 18px 44px rgba(17,24,39,.18);

      display:block;
      font-size:24px;
      margin-bottom:6px;
      font-family:var(--heading-font);

      color:rgba(255,255,255,.74);

      line-height:1.5;

      font-size:13px;
      margin-top:12px;

    .alt-card h3{
      margin:14px 0 8px;
      font-size:18px;
      font-family:var(--heading-font);

      font-size:15px;
    }

      box-shadow:0 16px 38px rgba(17,24,39,.06);
    }

      margin:0 0 8px;
      font-size:17px;
      font-family:var(--heading-font);

      margin:0;
      color:var(--textSecondary);
