      font-family:'IBM Plex Mono', monospace;
    }
    .plan_name{
      font-size:22px;
      margin-bottom:6px;
    }
    .pricing_card p{
      color:#bfbfbf;
      margin:0 0 18px;
      line-height:1.7;
    }
    .checklist{
      list-style:none;
      padding:0;
      margin:0 0 22px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .checklist li{
      display:flex;
      gap:12px;
      align-items:flex-start;
      color:#e7e7e7;
      font-size:15px;
      line-height:1.6;
    }
    .checkmark{
      width:22px;height:22px;min-width:22px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      background:rgba(33,196,93,.14);
      border:1px solid rgba(33,196,93,.24);
      color:#7cffac;
      font-size:13px;
      margin-top:1px;
    }

    .testimonial_wrap{
      position:relative;
      margin-top:28px;
    }
    .testimonial_slider{
      overflow:hidden;
    }
    .testimonial_track{
      display:flex;
      transition:transform .45s ease;
    }
    .testimonial_card{
      min-width:100%;
      background:linear-gradient(180deg, #171717, #101010);
      border:1px solid rgba(255,255,255,.08);
      border-radius:24px;
      padding:34px;
      position:relative;
      box-shadow:var(--shadow);
    }
    .quote_mark{
      font-size:72px;
      line-height:1;
      color:var(--accent);
      opacity:.85;
      margin-bottom:8px;
      font-family:Georgia, serif;
    }
    .stars{
      color:#ffbf36;
      letter-spacing:2px;
      margin-bottom:16px;
      font-size:18px;
    }
    .testimonial_card p{
      font-size:20px;
      line-height:1.8;
      color:#f1f1f1;
      margin:0 0 22px;
      max-width:900px;
    }
    .author_name{
      font-weight:800;
      font-size:17px;
      color:#fff;
    }
    .author_role{
      color:#9f9f9f;
      margin-top:4px;
      font-size:14px;
    }
    .testimonial_nav{
      display:flex;
      gap:12px;
      justify-content:flex-end;
      margin-top:18px;
    }
    .nav_arrow{
      width:48px;height:48px;border-radius:50%;
      border:1px solid rgba(255,255,255,.12);
      background:#141414;
      color:#fff;
      cursor:pointer;
      transition:all .25s ease;
    }
    .nav_arrow:hover{
      transform:translateY(-2px);
      box-shadow:0 10px 20px rgba(0,0,0,.3);
      border-color:rgba(255,107,0,.35);
    }

    .footer_section{
      background:#0d0d0d;
      border-top:1px solid rgba(255,255,255,.08);
      padding:56px 0 28px;
    }
    .footer_grid{
      display:grid;
      grid-template-columns:1.2fr 1fr 1fr;
      gap:28px;
      margin-bottom:28px;
    }
    .footer_brand p,.footer_col p,.footer_col a{
      color:#a9a9a9;
      line-height:1.8;
      font-size:15px;
    }
    .footer_col h4{
      margin-bottom:12px;
      font-size:16px;
    }
    .footer_links{
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .footer_bottom{
      border-top:1px solid rgba(255,255,255,.08);
      padding-top:18px;
      display:flex;
      justify-content:space-between;
      gap:16px;
      flex-wrap:wrap;
      color:#8b8b8b;
      font-size:14px;
    }

    .reveal{
      opacity:0;
      transform:translateY(28px);
      transition:opacity .8s ease, transform .8s ease;
    }
    .reveal.revealed{
      opacity:1;
      transform:none;
    }

    @keyframes floatY{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-10px)}
    }
    @keyframes pulseWidth{
      0%,100%{width:62%}
      50%{width:84%}
    }
    @keyframes typing{
      0%{width:0}
      40%{width:100%}
      60%{width:100%}
      100%{width:0}
    }
    @keyframes blink{
      50%{border-color:transparent}
    }
